[project]
name = "kontrola-jakosci-ml"
version = "0.1.0"
description = "Porównanie metod uczenia maszynowego w wizualnej kontroli jakości (detekcja anomalii, MVTec AD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",
    "anomalib>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcad"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
